# Typecheck, test and build every push and pull request, from a clean clone.
#
# CHECKS ONLY — THIS WORKFLOW MUST NOT DEPLOY. The sealed volumes' text
# (functions/lib/chronicle.ts, functions/lib/enforcement.ts) is gitignored, so
# a build here carries the committed placeholders. Deploying it would replace
# the live Chronicle and Ledger with placeholder text. Deploys stay manual,
# from the machine that holds those files (see CODEX.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Stand the placeholders in for the gitignored sealed modules, exactly
      # as a fresh clone is told to in their headers.
      - name: Use placeholder sealed volumes
        run: |
          cp functions/lib/chronicle.example.ts functions/lib/chronicle.ts
          cp functions/lib/enforcement.example.ts functions/lib/enforcement.ts

      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
