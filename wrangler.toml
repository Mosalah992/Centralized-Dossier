name = "thalmor-archives"
# Kept within wrangler@3's supported range — this project is pinned to Node 18
# so the clock-in bot's toolchain is left alone. See .nvmrc.
compatibility_date = "2024-09-23"

# Cloudflare Pages: Vite builds the site to dist/, and functions/ is deployed
# alongside it as the /api/* routes on the same origin.
pages_build_output_dir = "dist"

# Gate throttling. functions/api/gate.ts counts failed passphrase attempts per
# IP here — 8 per 10 minutes — and DISABLES ITSELF SILENTLY when the binding is
# absent (`if (!env.GATE_ATTEMPTS) return false`). It was absent until now, so
# the live gate accepted unlimited guesses at a word shared with ~100 people.
# Deleting this binding does not break the site; it quietly unlocks the door.
[[kv_namespaces]]
binding = "GATE_ATTEMPTS"
id = "0b84bdb3c52141a08506032df9c004d1"

[vars]
# The archive spreadsheet. The clock-in bot writes Roster G/H/J/K here; this
# site only ever reads.
SHEET_ID = "1KS__WJoqI_o3esXxO3Ei3L6SlJwJnOXQrjEr-FCPEZ0"

# Discord login — the second door beside the passphrase. Neither of these is a
# secret: the client id is handed to every visitor in the authorize URL, and the
# guild id is public to anyone in the guild. The third value, the client SECRET,
# is set with `wrangler pages secret put DISCORD_CLIENT_SECRET`.
#
# ALL THREE MISSING IS A SUPPORTED STATE, and it is what ships today: the gate
# hides the Discord button, /api/auth/login answers 503 for itself alone, and
# the passphrase carries on. That is deliberately unlike GATE_SECRET, whose
# absence seals the archive — an optional door being unconfigured must not lock
# a hundred people out. See functions/api/auth/login.ts.
#
# THE GUILD IDS ARE THE COMMUNITIES' SERVERS, NOT THE APPLICATION'S. The first
# was 1517187744840024204 from the day the door was built until 2026-08-21,
# which is a server created seven weeks after the community's own and is not one
# the members are in. Membership resolved 404 for every one of them and the gate
# answered "that name is not on the Embassy's rolls" — so the door was shut to
# precisely the people it was built for, and it read as ~100 individual account
# problems rather than one wrong number. The first id below is the guild the
# export scripts talk to (scripts/dump-informant-reports.mjs,
# scripts/informant-access.mjs) and the one docs/skyrim-press-history.md was
# transcribed from; check any replacement against those before trusting it.
#
# A COMMA-SEPARATED LIST, AND ORDER IS PRECEDENCE. Membership of ANY server here
# admits a reader. A reader in more than one is admitted under the first, and it
# is that server's roles the writ carries — role ids are only unique within
# their own server — so the Embassy's own guild stays at the head of the list.
# See functions/lib/guilds.ts; the parsing and the admission rules are tested in
# test/guilds.test.ts, because neither can be exercised without a real account
# in a real server.
#
# The second is the main Keizaal server. Adding it widened the archive's
# readership from the Embassy's own members to everyone in Keizaal, which is a
# deliberate decision and not a small one: this site carries ~100 real people's
# Discord handles, ranks and activity, and is noindexed over exactly that.
#
# Redirect URIs to register on the Discord application:
#   https://thalmor-archives.pages.dev/api/auth/callback
#   http://localhost:8788/api/auth/callback
#
DISCORD_CLIENT_ID = "1524083694598623553"
DISCORD_GUILD_ID  = "1498139135758831749,1350193670254497853"

# Writ rotation. Every writ carries the epoch it was signed under, and one
# signed under a different number is refused — so raising this invalidates every
# cookie the archive has ever issued, at once, for everyone.
#
# Raised to 2 when Discord became the door. Members admitted by the old shared
# word were still holding week-long writs and would never have seen the new gate
# until those expired; this puts all of them back at the seal to be identified
# by name. Raise it again to force the same thing.
GATE_EPOCH = "2"

# Secret (set with `npx wrangler pages secret put GOOGLE_SERVICE_ACCOUNT_JSON`):
#   GOOGLE_SERVICE_ACCOUNT_JSON - contents of the service-account key shared
#                                 with the spreadsheet. For local development
#                                 put it in .dev.vars instead, which is
#                                 git-ignored.
