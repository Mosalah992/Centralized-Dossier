name = "thalmor-archives"
# Kept within wrangler@3's supported range — this project is pinned to Node 18
# so the clock-in bot's toolchain is left alone. See .nvmrc.
compatibility_date = "2024-09-23"

# Cloudflare Pages: Vite builds the site to dist/, and functions/ is deployed
# alongside it as the /api/* routes on the same origin.
pages_build_output_dir = "dist"

# Throttling for the ONE door the archive still keeps: the Thalmor Chronicles'
# own word. functions/api/chronicle/gate.ts counts failed attempts per IP here —
# 8 per 10 minutes — and DISABLES ITSELF SILENTLY when the binding is absent
# (`if (!env.GATE_ATTEMPTS) return false`). Deleting this binding does not break
# the site; it quietly unlocks the volume.
#
# IT MATTERS MORE THAN IT USED TO. This throttle once sat behind the archive's
# own gate, so an attacker had to be an admitted member before they could spend
# a guess. That gate has been removed and the registers are public, which leaves
# the chronicle's word standing in front of the open internet with nothing but
# this in front of it.
[[kv_namespaces]]
binding = "GATE_ATTEMPTS"
id = "0b84bdb3c52141a08506032df9c004d1"

# The Latest Filings, written nightly by the thalmor-chronicler Worker and read
# here. THIS SIDE IS READ-ONLY BY CONVENTION — nothing under functions/ writes
# to it, for the same reason server/gsheets.ts mints a readonly token: the job
# owns this data and a bug in a request handler must not be able to rewrite it.
#
# Cron Triggers need a scheduled() handler and Pages Functions have none, which
# is why the collector is a separate Worker at all. The two projects meet here,
# so THE ID MUST MATCH chronicler/wrangler.toml. If they drift apart the volume
# shows an empty filings list and nothing reports an error — the read just finds
# a different, empty namespace.
#
# Absent binding is a supported state: /api/chronicle serves the written months
# and omits the filings. See functions/api/chronicle/index.ts.
[[kv_namespaces]]
binding = "CHRONICLE_FILINGS"
id = "e5d0df6b87984e46b38fc498bebb1b69"

[vars]
# The archive spreadsheet. The clock-in bot writes Roster G/H/J/K here; this
# site only ever reads.
SHEET_ID = "1KS__WJoqI_o3esXxO3Ei3L6SlJwJnOXQrjEr-FCPEZ0"


# Writ rotation, and it now governs the chronicle's writ alone — it is the only
# one left. Every writ carries the epoch it was signed under and one signed
# under a different number is refused, so raising this shuts the volume on
# everyone currently inside it, at once.
#
# DELIBERATELY NOT RAISED WHEN THE ARCHIVE'S GATE CAME DOWN. Raising it would
# have closed the Chronicles on every reader holding a good volume writ, to no
# purpose: what changed was that the registers around it became public, which
# takes nothing away from a word that still opens exactly what it always did.
# The stale archive writs the change did leave behind are refused on their
# scope instead — see the note in functions/lib/session.ts.
#
# It was raised to 2 when Discord briefly became the door.
GATE_EPOCH = "2"

# Secret (set with `npx wrangler pages secret put GOOGLE_SERVICE_ACCOUNT_JSON`):
#   GOOGLE_SERVICE_ACCOUNT_JSON - contents of the service-account key shared
#                                 with the spreadsheet. For local development
#                                 put it in .dev.vars instead, which is
#                                 git-ignored.
