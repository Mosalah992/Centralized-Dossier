name = "thalmor-archives"
# Wrangler 4 and the build/test toolchain run on the Node version pinned in
# .nvmrc. The external clock-in bot has its own repository and toolchain.
compatibility_date = "2024-09-23"

# Cloudflare Pages: Vite builds the site to dist/, and functions/ is deployed
# alongside it as the /api/* routes on the same origin.
pages_build_output_dir = "dist"

# Throttling for the ONE door the archive still keeps: the Thalmor Chronicles'
# own word. functions/api/chronicle/gate.ts counts failed attempts per IP here —
# 8 per 10 minutes — and DISABLES ITSELF SILENTLY when the binding is absent
# (`if (!env.GATE_ATTEMPTS) return false`). Deleting this binding does not break
# the site; it quietly unlocks the volume.
#
# IT MATTERS MORE THAN IT USED TO. This throttle once sat behind the archive's
# own gate, so an attacker had to be an admitted member before they could spend
# a guess. That gate has been removed and the registers are public, which leaves
# the chronicle's word standing in front of the open internet with nothing but
# this in front of it.
[[kv_namespaces]]
binding = "GATE_ATTEMPTS"
id = "0b84bdb3c52141a08506032df9c004d1"

# The Latest Filings, written nightly by the thalmor-chronicler Worker and read
# here. THIS SIDE IS READ-ONLY BY CONVENTION — nothing under functions/ writes
# to it, for the same reason server/gsheets.ts mints a readonly token: the job
# owns this data and a bug in a request handler must not be able to rewrite it.
#
# Cron Triggers need a scheduled() handler and Pages Functions have none, which
# is why the collector is a separate Worker at all. The two projects meet here,
# so THE ID MUST MATCH chronicler/wrangler.toml. If they drift apart the volume
# shows an empty filings list and nothing reports an error — the read just finds
# a different, empty namespace.
#
# Absent binding is a supported state: /api/chronicle serves the written months
# and omits the filings. See functions/api/chronicle/index.ts.
[[kv_namespaces]]
binding = "CHRONICLE_FILINGS"
id = "e5d0df6b87984e46b38fc498bebb1b69"

[vars]
# The archive spreadsheet. The clock-in bot writes Roster G/H/J/K here; this
# site only ever reads.
SHEET_ID = "1KS__WJoqI_o3esXxO3Ei3L6SlJwJnOXQrjEr-FCPEZ0"


# Writ rotation, one epoch per door. Every writ carries the epoch it was
# signed under and one signed under a different number is refused, so raising
# a value shuts that door on everyone currently through it, at once. (The
# Chronicles' GATE_EPOCH went with their gate on 2026-10-23.)
REPORTS_EPOCH = "1"
SOLAR_EPOCH = "1"

# The Scribe's Discord application (functions/api/discord/interactions.ts):
# ARCHIVIST ANCARION, the Embassy's established bot (the team's choice,
# 2026-11-03). Both values are public and were read from Discord with
# `node scripts/discord-setup.mjs app`.
DISCORD_APP_ID = "1524083694598623553"
DISCORD_PUBLIC_KEY = "f922e225bd23543b487bd91265f3b846ae032796f522dd045cc6b896ef330455"
# The Embassy's own server, the same one the collectors read.
DISCORD_GUILD_ID = "1498139135758831749"

# Ancarion has one interactions endpoint, and before the Scribe it was the
# quartermaster Worker's (/clockin, /clockout, /stock and the rest). Once
# `node scripts/discord-setup.mjs endpoint` moves it to the archive, the archive
# answers the Scribe's interactions and hands every other one, byte for byte,
# to this address (functions/lib/interactions-relay.ts). Clock-ins then depend
# on the archive being up: accepted, as the quartermaster's source is not kept
# here. Unset, every non-Scribe interaction is answered "cannot be reached".
QUARTERMASTER_INTERACTIONS_URL = "https://thalmor-quartermaster.salaz4r.workers.dev"

# Secret (set with `npx wrangler pages secret put GOOGLE_SERVICE_ACCOUNT_JSON`):
#   GOOGLE_SERVICE_ACCOUNT_JSON - contents of the service-account key shared
#                                 with the spreadsheet. For local development
#                                 put it in .dev.vars instead, which is
#                                 git-ignored.
#   REPORTS_PASSPHRASE          - word required to open the Reports gate (the Cabinet).
#   REPORTS_COOKIE_SECRET       - signing secret for Reports-only writs.
#   SOLAR_PASSPHRASE            - word spoken at Ancarion's plate to open the Solar.
#   SOLAR_COOKIE_SECRET         - signing secret for Solar-only writs.
#   DISCORD_BOT_TOKEN           - Archivist Ancarion's bot token, under the name the
#                                 collector Workers use for theirs: re-checks a code
#                                 holder's roles and posts filings. In the repo's
#                                 .env the live copy is DISCORD_TOKEN (2026-11-03);
#                                 DISCORD_BOT_TOKEN there is a revoked one.
#   CODE_PEPPER                 - any long random string. Codes are stored as
#                                 HMAC(CODE_PEPPER, code) and the Scribe Table's
#                                 seal is signed under a key derived from it;
#                                 changing it retires every code and seal.

# Private, structured Discord reports. The Reports API only reads it after a
# Reports-only writ; the scheduled collector is its only writer. The Solar's
# war-table pieces (solar_pins, migrations/0005) are kept here too, behind the
# Solar writ.
[[d1_databases]]
binding = "REPORTS"
database_name = "thalmor-reports"
database_id = "edbd9716-5154-4e93-84bd-4768f8d23ce8"

# The Scribe (scribe/), which draws every filing's parchment. A Worker of its
# own, reached only through this binding. DEPLOY IT FIRST:
#   npx wrangler deploy -c scribe/wrangler.toml
# Without it the Scribe Table cannot preview and parchments answer 503; the
# filings themselves are still recorded.
[[services]]
binding = "SCRIBE"
service = "thalmor-scribe"
