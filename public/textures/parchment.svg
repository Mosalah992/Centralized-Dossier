<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <!-- Opaque parchment: a cream ground, broad tea-coloured mottling, faint
       fibres and the odd foxing spot. Edges are darkened by box-shadow in
       CSS, not here, so the tile can repeat. -->
  <filter id="mottle" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.006" numOctaves="4" seed="12" stitchTiles="stitch" />
    <feColorMatrix type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.4  0 0 0 0 0.2  1.3 0 0 0 -0.52" />
  </filter>
  <filter id="fibre" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.6 0.05" numOctaves="2" seed="5" stitchTiles="stitch" />
    <feColorMatrix type="matrix" values="0 0 0 0 0.4  0 0 0 0 0.3  0 0 0 0 0.15  0.6 0 0 0 -0.32" />
  </filter>
  <filter id="foxing" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="31" stitchTiles="stitch" />
    <feColorMatrix type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.28  0 0 0 0 0.1  6 0 0 0 -4.5" />
  </filter>
  <rect width="600" height="600" fill="#ecdcb6" />
  <rect width="600" height="600" filter="url(#mottle)" />
  <rect width="600" height="600" filter="url(#fibre)" />
  <rect width="600" height="600" filter="url(#foxing)" />
</svg>
