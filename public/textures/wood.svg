<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
  <!-- Vertical oak boarding: four planks per tile, each its own tone, with
       grain stretched along the board and dark seams between. Tiles without
       a seam because every turbulence stitches. -->
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.22 0.006" numOctaves="4" seed="9" stitchTiles="stitch" />
    <feColorMatrix type="matrix" values="0 0 0 0 0.08  0 0 0 0 0.04  0 0 0 0 0.01  2.4 0 0 0 -0.95" />
  </filter>
  <filter id="figure" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="turbulence" baseFrequency="0.035 0.004" numOctaves="2" seed="3" stitchTiles="stitch" />
    <feColorMatrix type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.36  0 0 0 0 0.2  -3 0 0 0 0.32" />
  </filter>
  <rect width="120" height="480" fill="#33200f" />
  <rect x="120" width="120" height="480" fill="#2b1a0c" />
  <rect x="240" width="120" height="480" fill="#36220f" />
  <rect x="360" width="120" height="480" fill="#2e1c0d" />
  <rect width="480" height="480" filter="url(#figure)" />
  <rect width="480" height="480" filter="url(#grain)" />
  <g fill="#120a04">
    <rect x="0" width="3" height="480" />
    <rect x="120" width="3" height="480" />
    <rect x="240" width="3" height="480" />
    <rect x="360" width="3" height="480" />
  </g>
  <g fill="#5a3a1e" opacity=".35">
    <rect x="3" width="1" height="480" />
    <rect x="123" width="1" height="480" />
    <rect x="243" width="1" height="480" />
    <rect x="363" width="1" height="480" />
  </g>
</svg>
