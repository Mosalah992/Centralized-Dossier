<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Thalmor Embassy Archives</title>
    <meta
      name="description"
      content="Administrative registers of the Thalmor Embassy of the Province of Skyrim."
    />
    <meta name="theme-color" content="#161311" />

    <!--
      The archive is open to anyone given the link, exactly like the underlying
      spreadsheet. It is kept out of search engines because it carries about a
      hundred real people's Discord handles, ranks and activity, and the sheet
      itself is not indexed either. Remove this to make the archive findable.
    -->
    <meta name="robots" content="noindex, nofollow" />

    <!--
      Cinzel and EB Garamond are self-hosted, imported from web/src/main.tsx.
      Nothing here reaches a third party: the noindex above exists to keep real
      people's handles out of search, and handing every reader's IP and referrer
      to a font CDN to render the page works against that.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/web/src/main.tsx"></script>
  </body>
</html>
